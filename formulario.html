<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEPALMA - Compra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/responsivo.css">
</head>

<body>
    <header>
        <a class="marca" href="index.html">ADEPALMA Casanare</a>
        <nav aria-label="Navegación principal">
            <ul>
               <li><a href="index.html">Inicio</a></li>
                <li><a href="precios.html">Precios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="formulario.html" aria-current="page">Compra</a></li>
                <li><a href="puntos.html">Puntos</a></li>
                <li><a href="panel.php">Lotes</a></li>
            </ul>
        </nav>
    </header>

    <div class="banner">
        <h1>Datos de compra</h1>
    </div>

    <main>
        <form id="formCompra" action="registro.php" method="post">
            <fieldset>
                <legend>Datos de Compra</legend>

                <div class="campos">
                    <div class="campo campo-ancho">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" autocomplete="name"
                               required minlength="5" maxlength="80">
                    </div>

                    <div class="campo">
                        <label for="cedula">Número de cédula o NIT</label>
                        <input type="text" id="cedula" name="cedula" inputmode="numeric"
                               required pattern="[0-9]{6,10}"
                               title="Entre 6 y 10 dígitos, sin puntos">
                    </div>

                    <div class="campo">
                        <label for="celular">Celular</label>
                        <input type="tel" id="celular" name="celular" autocomplete="tel">
                    </div>

                    <div class="campo campo-ancho">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" autocomplete="email">
                    </div>

                    <div class="campo campo-ancho">
                        <label for="lugar">Lugar de envío</label>
                        <input type="text" id="lugar" name="lugar" autocomplete="street-address">
                    </div>

                    <div class="campo">
                        <label for="cantidad">Cantidad</label>
                        <input type="number" id="cantidad" name="cantidad"
                               min="0.5" max="500" step="0.5" required>
                    </div>

                    <div class="campo">
                        <label for="fecha">Fecha de compra</label>
                        <input type="date" id="fecha" name="fecha">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Observaciones y autorización</legend>

                <div class="campo">
                    <label for="obs">Observaciones</label>
                    <textarea name="obs" id="obs" rows="4" maxlength="300"></textarea>
                </div>

                <label class="casilla" for="datos">
                    <input type="checkbox" name="datos" id="datos" required>
                    Autorizo el tratamiento de mis datos personales
                </label>
            </fieldset>

            <button class="boton" type="submit">Enviar</button>

            <p class="mensaje" id="mensaje" role="status"></p>
        </form>
    </main>

    <footer>
        <p>ADEPALMA Casanare - Yopal, Casanare</p>
    </footer>

    <script>
        // Este evento se ejecuta solo cuando el formulario ya pasó todas las validaciones
        document.getElementById("formCompra").addEventListener("submit", function (evento) {
            // Aún no existe registro.php, así que evitamos el envío real.
            // Cuando tenga el servidor listo, borre la línea de preventDefault.
            evento.preventDefault();

            let nombre = document.getElementById("nombre").value;
            document.getElementById("mensaje").innerText =
                "Gracias, " + nombre + ". Recibimos su solicitud de compra.";
            this.reset();
        });
    </script>
</body>
</html>
