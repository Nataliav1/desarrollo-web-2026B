<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            max-width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items:center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;

            form {
                width: 340px;
                display: flex;
                padding: 1rem;
                flex-direction: column;
                gap: 4px;
                background-color: #f5f5f5;
            }
        }
    </style>
</head>
<body>

    <form action="registro.php" method="post">
        <fieldset>
           <legend>Datos de Compra</legend> 


        <p>
            <label for="nombre">Nombre completo</label>
            <input 
                type="text" 
                id="nombre"
                name="nombre"
                required
                minlength="5"
                maxlength="80">
        </p>

        <p>
            <label for="cedula">Numero de cedula o NIT</label>
            <input type="text" id="cedula"
                name="cedula"
                required
                pattern="[0-9]{6,10}"
                title="Entre 6 y 10 digitos, sin puntos">
        </p>


        <p>

            <label for="correo">Correo electronico</label>
            <input type="email" id="correo"
                    name="correo">

        </p>

        
        <p>
            <label for="celular">Celular</label>
            <input type="tel" id="celular"
                name="celular">
        </p>

         <p>
            <label for="lugar">Lugar de envio</label>
            <input type="text" id="lugar"
                name="lugar">
        </p>

        <p>
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad"
                name="hectareas"
                min="0.5" max="500"  step="0.5"
                required>
        </p>

        <p>
            <label for="siembra">Fecha de compra</label>
            <input type="date" id="fecha"
                    name="fecha"
                    >
        </p>


        </fieldset>

        
       

        <fieldset>
            <legend>Observaciones y autorizacion</legend>
            <label for=""obs>Observaciones</label>
            <textarea name="obs" id="obs" rowa="4" maxlength="300"></textarea>
            <label for="datos" style="text-align: center"
                >Autoriza el tratamiento  de mis datos personales</label>
            <input type="checkbox" name="datos" id="datos"/>

        </fieldset>

        <button type="submit" onclick="Enviar()">Enviar</button>
    </form>
    <script>
        function Enviar() {
            alert ("Se envio");

        }
    </script>





     
    
</body>
</html>
